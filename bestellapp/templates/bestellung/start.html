<!doctype html>
<html lang="de" data-bs-theme="light">
    <head>
        <title>Bestellung Mittag</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <h1>Bestellung Mittagessen</h1>
                        <form>
                            <select class="form-select shadow" aria-label="Team">
                                <option value="-">Wählen Sie ein Team aus</option>
                                {% for team in teams %}
                                    <option value="{{team.id}}">{{team}}</option>
                                {% endfor %}
                            </select>
                            <hr />  
                            {% csrf_token %}
                            {% for menue in menues %}
                                <h2 class="">{{menue}}</h2>
                                <p class="border shadow p-3">{{menue.description}}
                                <div class="mb-3">
                                    <label for="" class="form-label">Portionen</label>
                                    <input
                                        type="number"
                                        class="form-control shadow"
                                        name=""
                                        id="{{menue.id}}"
                                        aria-describedby="helpId"
                                        placeholder=""
                                    />
                                    <small id="helpId" class="form-text text-body-secondary"
                                        >Anzahl Portionen</small
                                    >
                                    <hr />
                                </div>   
                            {% endfor %}
                            <button type="button" class="btn btn-outline-success float-right shadow">Anmelden</button>
                        </form>
                    </div>
                </div>
            </div>

        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
